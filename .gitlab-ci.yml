stages:
  - build

variables:
  GIT_SUBMODULE_STRATEGY: recursive
  DOCKER_DRIVER: overlay2

default:
  image:
    name: "ghcr.io/canonical/snapcraft:8_core24"
    entrypoint: [""]

.arm64: &arm64
  variables:
    ARCH: "arm64"

.amd64: &amd64
  variables:
    ARCH: "amd64"

.snap:
  stage: build
  script:
    - export PATH=/usr/libexec/snapcraft:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
    - export SNAPCRAFT_BUILD_ENVIRONMENT=host
    - export UBPORTS_GITLAB_CI=1
    - apt update
    - apt install -y cmake build-essential
    - snapcraft pack --verbose && echo "$ARCH CI build successful!"

snap:arm64:
  <<: *arm64
  extends: .snap

snap:amd64:
  <<: *amd64
  extends: .snap
